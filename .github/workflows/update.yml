name: Tralala

on:
  schedule:
    - cron: "0 * */1 * *"
  push:
    branches: [ master ]
  watch:
    type: started
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [24.x]
        
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
   
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
      # 3. Install npm dependencies
    - name: Install dependencies
      run: npm i --no-package-lock
      # 4. Install system libs Puppeteer's Chromium needs
    - name: Install Puppeteer dependencies
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-6 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxtst6 libnss3 libglib2.0-0 libgtk-3-0t64 \
            libasound2t64 libxrandr2 libpangocairo-1.0-0 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdbus-1-3 libdrm2 libgbm1 \
            libgdk-pixbuf2.0-0

    - name: Run
      run: |
          npm install puppeteer @inquirer/prompts chalk ora cli-progress axios
          node auto.js
    - name: Woof
      run: |
        git config --local user.email "41298282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "APSHHSS" -a || true
    - name: Create files
      uses: EndBug/add-and-commit@v9
      with:
       message: Meow
       committer_name: GitHub Actions
       committer_email: 41898282+github-actions[bot]@users.noreply.github.com
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}